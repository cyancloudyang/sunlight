# Where public builds live. scripts/package.sh writes the Sparkle keys into Info.plist from here, and
# scripts/release.sh uses the rest. Sparkle stays off in builds where either key is empty.
#
# Tablecloth fork: these are deliberately empty. The upstream values pointed updates and the Homebrew tap
# at spacefarm-digital's own repositories and at a key only upstream holds the private half of — a fork
# build carrying them would take its updates from whoever holds that key, and could be updated back into
# the upstream app, losing the fork's safety boundary (handoff #11). Sparkle is therefore off: no
# SUFeedURL and no SUPublicEDKey go into Info.plist, and scripts/release.sh refuses to publish.
# A fork release needs its own `make sparkle-keys` pair, its own releases repository and its own tap
# before any of these is filled in. Do not invent a URL or a key to fill them.

RELEASES_REPO=""
SPARKLE_FEED_URL=""
SPARKLE_PUBLIC_KEY=""
TAP_REPO=""
